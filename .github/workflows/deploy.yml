name: Deploy

# Deploys on every push to main that changes something the service actually
# serves. A README edit does not warrant a new revision.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "data/**"
      - "Dockerfile"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Never let an older build land on top of a newer one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # for Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Inert until the variables exist, so pushes do not fail before setup.
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != ''
    steps:
      - uses: actions/checkout@v4

      # GitHub's OIDC token is exchanged for short-lived Google credentials at
      # run time. No service account key is stored in this repository.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        env:
          PROJECT: ${{ vars.GCP_PROJECT || 'ff-python-api' }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'nfl-projections' }}
          RUNTIME_SA: ${{ vars.CLOUD_RUN_RUNTIME_SA || 'nfl-projections-run' }}
          # Neither is a secret: the client id is served to the page, and the
          # allow list is an address you publish anyway. They are variables so
          # that changing who may write does not need a code change.
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS }}
        run: |
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --source=. \
            --service-account="${RUNTIME_SA}@${PROJECT}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --min-instances=0 --max-instances=2 --memory=512Mi \
            --set-env-vars="GCP_PROJECT=${PROJECT},BIGQUERY_ENABLED=true,GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID},ALLOWED_EMAILS=${ALLOWED_EMAILS}" \
            --quiet

      # A green deploy means the revision was accepted, not that it starts.
      - name: Prove it boots
        env:
          PROJECT: ${{ vars.GCP_PROJECT || 'ff-python-api' }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'nfl-projections' }}
        run: |
          URL="$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT}" --region="${REGION}" --format='value(status.url)')"
          for _ in $(seq 1 30); do
            if curl -fsS "${URL}/api/healthz"; then
              echo "::notice::${URL} is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::${URL} never answered /api/healthz"
          exit 1
