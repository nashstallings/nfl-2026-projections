name: Deploy

# Deploys on every push to main that changes something the service actually
# serves. A README edit does not warrant a new revision.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "data/**"
      - "Dockerfile"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Never let an older build land on top of a newer one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # for Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Inert until the variables exist, so pushes do not fail before setup.
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != ''
    steps:
      - uses: actions/checkout@v5

      # GitHub's OIDC token is exchanged for short-lived Google credentials at
      # run time. No service account key is stored in this repository.
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      # `gcloud run deploy` against a service account that does not exist fails
      # on actAs, which reads like the deployer is missing a permission rather
      # than like bootstrap.sh was never run. Check first and say so.
      #
      # The check has to tell "not found" from "not allowed to look", or it
      # reports a missing account every time the deployer simply cannot read
      # IAM — which is a lie that sends you off to re-run bootstrap for nothing.
      # Anything other than a definite NOT_FOUND warns and continues; the deploy
      # itself is the authority.
      #
      # The dataset is deliberately not checked here. Only the runtime account
      # needs to read BigQuery, and granting the deployer that access purely to
      # run a diagnostic would widen it for no benefit. bootstrap.sh verifies
      # the dataset as the human who owns it.
      - name: Check prerequisites
        env:
          PROJECT: ${{ vars.GCP_PROJECT || 'ff-python-api' }}
          RUNTIME_SA: ${{ vars.CLOUD_RUN_RUNTIME_SA || 'nfl-projections-run' }}
        run: |
          SA="${RUNTIME_SA}@${PROJECT}.iam.gserviceaccount.com"
          if OUT="$(gcloud iam service-accounts describe "${SA}" \
                      --project="${PROJECT}" 2>&1)"; then
            echo "${SA} exists"
            exit 0
          fi
          if grep -qiE 'not_?found|does not exist' <<<"${OUT}"; then
            echo "::error::${SA} does not exist. Run ./infra/bootstrap.sh in Cloud Shell, then re-run this workflow."
            exit 1
          fi
          echo "::warning::could not verify ${SA} — the deployer may lack iam.serviceAccounts.get. Continuing; a genuinely missing account fails the deploy with actAs."
          echo "${OUT}"

      - name: Deploy to Cloud Run
        env:
          PROJECT: ${{ vars.GCP_PROJECT || 'ff-python-api' }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'nfl-projections' }}
          RUNTIME_SA: ${{ vars.CLOUD_RUN_RUNTIME_SA || 'nfl-projections-run' }}
          # Neither is a secret: the client id is served to the page, and the
          # allow list is an address you publish anyway. They are variables so
          # that changing who may write does not need a code change.
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS }}
          BQ_DATASET: ${{ vars.BQ_DATASET || 'projections' }}
          BQ_TABLE: ${{ vars.BQ_TABLE || 'player_projections' }}
        # ^|^ changes the delimiter gcloud splits the variable list on. The
        # default is a comma, which ALLOWED_EMAILS uses between addresses.
        run: |
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --source=. \
            --service-account="${RUNTIME_SA}@${PROJECT}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --min-instances=0 --max-instances=2 --memory=512Mi \
            --set-env-vars="^|^GCP_PROJECT=${PROJECT}|BQ_DATASET=${BQ_DATASET}|BQ_TABLE=${BQ_TABLE}|BIGQUERY_ENABLED=true|GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}|ALLOWED_EMAILS=${ALLOWED_EMAILS}" \
            --quiet

      # A green deploy means the revision was accepted, not that it starts.
      - name: Prove it boots
        env:
          PROJECT: ${{ vars.GCP_PROJECT || 'ff-python-api' }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'nfl-projections' }}
        run: |
          URL="$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT}" --region="${REGION}" --format='value(status.url)')"
          for _ in $(seq 1 30); do
            if curl -fsS "${URL}/api/healthz"; then
              echo "::notice::${URL} is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::${URL} never answered /api/healthz"
          exit 1
