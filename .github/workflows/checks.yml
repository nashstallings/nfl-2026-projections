name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # The projection model lives in JavaScript so the dashboard can recompute
      # as you type; its tests run on node with no dependencies to install.
      - name: Model tests
        run: node --test 'tests/**/*.test.js'

      - name: Server tests
        run: pytest -q
