[project]
name = "nfl-2026-projections"
version = "0.1.0"
description = "Project NFL fantasy production from team volume and vacated share"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI declares dependencies as argument defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# SIM117: a test reads better with its setup context separate from the
# pytest.raises it is asserting on; merging them buries the assertion.
"tests/*" = ["SIM117"]
