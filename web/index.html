<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2026 Projections</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27><text y=%2714%27 font-size=%2714%27>🏈</text></svg>"
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <h1>2026 Projections</h1>
        <nav class="tabs" id="tabs">
          <button class="tab is-active" data-view="team">Team</button>
          <button class="tab" data-view="board">Board</button>
        </nav>
      </div>
      <div class="topbar-right">
        <span class="save-state" id="save-state">Saved locally</span>
        <span class="identity" id="identity" hidden></span>
        <div id="signin-button"></div>
        <button class="btn btn-ghost" id="export-btn" title="Download as JSON">Export</button>
        <button class="btn btn-primary" id="save-btn">Save to BigQuery</button>
      </div>
    </header>

    <div class="banner" id="banner" hidden></div>

    <main>
      <!-- Team workbench -->
      <section class="view" id="view-team">
        <div class="controls">
          <label class="field">
            <span>Team</span>
            <select id="team-select"></select>
          </label>
          <label class="field">
            <span>Scoring</span>
            <select id="format-select">
              <option value="ppr">Full PPR</option>
              <option value="half_ppr">Half PPR</option>
              <option value="std">Standard</option>
            </select>
          </label>
          <button class="btn btn-ghost" id="reset-team">Reset to 2025</button>
        </div>

        <section class="panel">
          <h2>2026 team volume</h2>
          <p class="hint">
            Starts at last season's totals. Change these first — every player's
            projection is a share of these numbers.
          </p>
          <div class="volume-grid" id="volume-grid"></div>
        </section>

        <section class="panel">
          <h2>Allocation</h2>
          <p class="hint" id="allocation-hint"></p>
          <div class="table-scroll">
            <table class="grid" id="allocation-table">
              <thead>
                <tr id="allocation-head">
                  <th class="sticky-col sortable" data-sort="player" data-type="text">Player</th>
                  <th class="sortable" data-sort="position" data-type="text">Pos</th>
                  <th class="sortable" data-sort="last">2025</th>
                  <th class="num sortable" data-sort="games">G</th>
                  <th class="num sortable" data-sort="share_pass">Att %</th>
                  <th class="num sortable" data-sort="share_rush">Car %</th>
                  <th class="num sortable" data-sort="share_recv">Tgt %</th>
                  <th class="num sortable" data-sort="att">Att</th>
                  <th class="num sortable" data-sort="car">Car</th>
                  <th class="num sortable" data-sort="tgt">Tgt</th>
                  <th class="num sortable" data-sort="yds">Yds</th>
                  <th class="num sortable" data-sort="td">TD</th>
                  <th class="num sortable" data-sort="pts">Pts</th>
                  <th class="num sortable" data-sort="ppg">PPG</th>
                </tr>
              </thead>
              <tbody id="allocation-body"></tbody>
              <tfoot id="allocation-foot"></tfoot>
            </table>
          </div>
        </section>
      </section>

      <!-- Cross-team board -->
      <section class="view" id="view-board" hidden>
        <div class="controls">
          <label class="field">
            <span>Position</span>
            <select id="board-position">
              <option value="ALL">All</option>
              <option value="QB">QB</option>
              <option value="RB">RB</option>
              <option value="WR">WR</option>
              <option value="TE">TE</option>
            </select>
          </label>
          <label class="field">
            <span>Scoring</span>
            <select id="board-format">
              <option value="ppr">Full PPR</option>
              <option value="half_ppr">Half PPR</option>
              <option value="std">Standard</option>
            </select>
          </label>
          <span class="hint" id="board-hint"></span>
        </div>
        <section class="panel">
          <div class="table-scroll">
            <table class="grid" id="board-table">
              <thead>
                <tr id="board-head">
                  <th class="num sortable" data-sort="rank">#</th>
                  <th class="sticky-col sortable" data-sort="player" data-type="text">Player</th>
                  <th class="sortable" data-sort="position" data-type="text">Pos</th>
                  <th class="sortable" data-sort="team" data-type="text">Team</th>
                  <th class="num sortable" data-sort="games">G</th>
                  <th class="num sortable" data-sort="att">Att</th>
                  <th class="num sortable" data-sort="car">Car</th>
                  <th class="num sortable" data-sort="rec">Rec</th>
                  <th class="num sortable" data-sort="yds">Yds</th>
                  <th class="num sortable" data-sort="td">TD</th>
                  <th class="num sortable" data-sort="pts">Pts</th>
                  <th class="num sortable" data-sort="ppg">PPG</th>
                </tr>
              </thead>
              <tbody id="board-body"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
